
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d19">
  <title>Members | Najua Tech</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080d19;
      --panel: #111a2b;
      --line: #26354d;
      --text: #edf4ff;
      --muted: #9aaac2;
      --accent: #62e6c4;
      --blue: #7ba7ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(ellipse at top, #142542 0, var(--bg) 55%);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    .wrap { width: min(1120px, 92%); margin: auto; }

    header {
      border-bottom: 1px solid var(--line);
      background: rgba(8, 13, 25, .88);
    }

    .nav {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand { font-weight: 850; font-size: 1.2rem; letter-spacing: -.04em; }
    .brand span { color: var(--accent); }

    .nav-links { display: flex; gap: 18px; color: var(--muted); font-size:
.92rem; }
    .nav-links a:hover { color: var(--accent); }

    main { padding: 54px 0 80px; }

    .eyebrow {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: .75rem;
      font-weight: 800;
    }

    h1 { font-size: clamp(2.2rem, 6vw, 4rem); letter-spacing: -.055em;
margin: 12px 0; }
    .intro { color: var(--muted); max-width: 620px; line-height: 1.7; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 32px 0 18px;
    }

    input, button {
      font: inherit;
      border-radius: 12px;
      padding: 13px 15px;
    }

    input {
      flex: 1 1 260px;
      min-width: 0;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      outline: none;
    }

    input:focus { border-color: var(--accent); }

    button {
      border: 0;
      background: var(--accent);
      color: #07131a;
      font-weight: 800;
      cursor: pointer;
    }

    .status { color: var(--muted); margin: 16px 0 24px; line-height: 1.6; }
    .status a { color: var(--accent); text-decoration: underline; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px),
1fr));
      gap: 18px;
    }

    .member {
      background: linear-gradient(145deg, #152239, #0e1626);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 23px;
      min-width: 0;
      transition: border-color .2s, transform .2s;
    }

    .member:hover { border-color: #527b9b; transform: translateY(-2px); }

    .member-top { display: flex; gap: 14px; align-items: center;
margin-bottom: 20px; }

    .avatar {
      width: 52px; height: 52px; flex: 0 0 52px;
      border-radius: 16px;
      display: grid; place-items: center;
      background: #203b4b; color: var(--accent);
      font-size: 1.25rem; font-weight: 850;
    }

    .member h2 { font-size: 1.12rem; margin: 0 0 5px; overflow-wrap:
anywhere; }
    .focus { font-size: .83rem; color: var(--blue); }
    .label { color: var(--accent); font-size: .73rem; text-transform:
uppercase; letter-spacing: .1em; font-weight: 800; margin: 19px 0 7px; }
    .bio { color: #c6d2e4; line-height: 1.6; font-size: .93rem; white-space:
pre-wrap; overflow-wrap: anywhere; margin: 0; }
    .tags { display: flex; flex-wrap: wrap; gap: 7px; }

    .tag {
      background: #1b2b41; border: 1px solid #30435e;
      color: #d7e7fa; border-radius: 999px;
      padding: 6px 10px; font-size: .8rem; overflow-wrap: anywhere;
    }

    .empty {
      border: 1px dashed #344761; border-radius: 18px;
      padding: 28px; color: var(--muted); line-height: 1.7;
      grid-column: 1 / -1;
    }

    footer { border-top: 1px solid var(--line); padding: 24px 0; color:
var(--muted); font-size: .85rem; }

    @media (max-width: 520px) {
      .nav { align-items: flex-start; flex-direction: column; padding: 17px
0; }
      .nav-links { flex-wrap: wrap; gap: 14px; }
      main { padding-top: 36px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap nav">
      <a class="brand" href="./index.html">NAJUA <span>TECH</span></a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="./index.html">Home</a>
        <a href="./dashboard.html">Dashboard</a>
        <a href="./forum.html">Forum</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="eyebrow">The community</div>
    <h1>Meet the members.</h1>
    <p class="intro">
      Discover fellow developers, explore their skills, and find people
      interested in building technology together.
    </p>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Search names, skills or
interests..."
             aria-label="Search members" autocomplete="off">
      <button id="refresh" type="button">Refresh members</button>
    </div>

    <p id="status" class="status" role="status" aria-live="polite">
      Checking your sign-in session...
    </p>

    <section id="members" class="grid" aria-label="Najua Tech
members"></section>
  </main>

  <footer>
    <div class="wrap">Najua Tech · Learn together. Build together.</div>
  </footer>

  <script>
    const API = "https://najua-auth-app.najuatech.workers.dev";
    const statusEl = document.getElementById("status");
    const membersEl = document.getElementById("members");
    const searchEl = document.getElementById("search");
    const refreshEl = document.getElementById("refresh");

    let members = [];

    async function apiRequest(path) {
      const response = await fetch(API + path, {
        credentials: "include",
        headers: { "Accept": "application/json" }
      });

      let data = {};
      try { data = await response.json(); } catch (_) {}

      if (!response.ok) {
        const error = new Error(data.error || data.message || "Request
failed.");
        error.status = response.status;
        throw error;
      }
      return data;
    }

    function makeElement(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    }

    function addTags(container, value) {
      const values = (value || "").split(/[,;\n]/).map(s =>
s.trim()).filter(Boolean);
      if (!values.length) {
        container.append(makeElement("span", "bio", "Not added yet"));
        return;
      }
      values.forEach(value => container.append(makeElement("span", "tag",
value)));
    }

    function renderMembers() {
      const query = searchEl.value.trim().toLowerCase();
      const filtered = members.filter(member =>
        [member.name, member.bio, member.skills, member.interests,
member.focus_area]
          .some(value => (value || "").toLowerCase().includes(query))
      );

      membersEl.replaceChildren();

      if (!filtered.length) {
        const message = members.length
          ? "No members match that search. Try another name, skill, or
interest."
          : "No members are available to display yet.";
        membersEl.append(makeElement("div", "empty", message));
        return;
      }

      filtered.forEach(member => {
        const card = makeElement("article", "member");
        const top = makeElement("div", "member-top");
        const displayName = member.name || "Najua Tech member";
        const avatar = makeElement("div", "avatar",
          displayName.trim().charAt(0).toUpperCase() || "N");
        avatar.setAttribute("aria-hidden", "true");

        const identity = document.createElement("div");
        identity.append(makeElement("h2", "", displayName));
        identity.append(makeElement("div", "focus", member.focus_area ||
"Developer"));
        top.append(avatar, identity);
        card.append(top);

        card.append(makeElement("div", "label", "About"));
        card.append(makeElement("p", "bio",
          member.bio || "This member hasn't added a bio yet."));

        card.append(makeElement("div", "label", "Skills"));
        const skills = makeElement("div", "tags");
        addTags(skills, member.skills);
        card.append(skills);

        card.append(makeElement("div", "label", "Interests"));
        const interests = makeElement("div", "tags");
        addTags(interests, member.interests);
        card.append(interests);

        membersEl.append(card);
      });
    }

    async function loadMembers() {
      refreshEl.disabled = true;
      statusEl.textContent = "Loading members...";
      membersEl.replaceChildren();

      try {
        const session = await apiRequest("/api/auth/get-session");
        if (!session.user) {
          statusEl.replaceChildren(
            document.createTextNode("Please "),
            Object.assign(document.createElement("a"), {
              href: "./login.html",
              textContent: "sign in"
            }),
            document.createTextNode(" to view the members directory.")
          );
          return;
        }

        const data = await apiRequest("/api/members");
        members = Array.isArray(data.members) ? data.members : [];
        statusEl.textContent = `${members.length} registered
member${members.length === 1 ? "" : "s"} in the directory.`;
        renderMembers();
      } catch (error) {
        members = [];
        if (error.status === 401) {
          statusEl.replaceChildren(
            document.createTextNode("Please "),
            Object.assign(document.createElement("a"), {
              href: "./login.html",
              textContent: "sign in"
            }),
            document.createTextNode(" to view the members directory.")
          );
        } else {
          statusEl.textContent = "We couldn't load the directory. Check your
connection and try again.";
        }
      } finally {
        refreshEl.disabled = false;
      }
    }

    searchEl.addEventListener("input", renderMembers);
    refreshEl.addEventListener("click", loadMembers);
    loadMembers();
  </script>
</body>
</html>
