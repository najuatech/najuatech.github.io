<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d1a">
  <title>Project Administration | Najua Tech</title>
  <style>
    :root {
      --bg:#080d1a; --panel:#101a2d; --blue:#48a7ff;
      --cyan:#56f0e0; --white:#f5f8ff; --muted:#a7b4ca;
      --line:#24334b; --red:#ff9292; --green:#a9f5ca;
    }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body {
      margin:0; background:var(--bg); color:var(--white);
      font:16px/1.6 Arial,Helvetica,sans-serif;
    }
    a { color:inherit; text-decoration:none; }
    .container { width:min(1100px,92%); margin:auto; }
    header { border-bottom:1px solid var(--line); background:#080d1af5; }
    nav {
      min-height:74px; display:flex; align-items:center;
      justify-content:space-between; gap:16px; flex-wrap:wrap;
    }
    .logo { font-size:22px; font-weight:900; letter-spacing:1px; }
    .logo span { color:var(--cyan); }
    .muted { color:var(--muted); }
    main { padding:38px 0 70px; }
    .topline {
      display:flex; justify-content:space-between; align-items:center;
      gap:16px; flex-wrap:wrap; margin-bottom:24px;
    }
    .eyebrow {
      color:var(--cyan); font-size:12px; letter-spacing:3px;
      font-weight:bold; text-transform:uppercase;
    }
    h1 { font-size:clamp(32px,6vw,48px); line-height:1.15; margin:10px 0; }
    h2 { font-size:21px; margin:0 0 7px; overflow-wrap:anywhere; }
    h3 { font-size:15px; margin:18px 0 7px; }
    button, .button {
      display:inline-block; border:1px solid var(--line); border-radius:9px;
      padding:10px 15px; font-weight:700; cursor:pointer; font-size:14px;
      background:#14233a; color:var(--white);
    }
    button:disabled { opacity:.55; cursor:wait; }
    .primary {
      color:#07111e; background:linear-gradient(100deg,var(--cyan),var(--blue));
      border:0;
    }
    .reject { border-color:#75404a; color:#ffb2b2; background:#291721; }
    .status {
      padding:13px 16px; border:1px solid var(--line); border-radius:10px;
      margin:16px 0; color:var(--muted); overflow-wrap:anywhere;
    }
    .status.error { border-color:#75404a; color:var(--red); }
    .status.success { color:var(--cyan); }
    .toolbar {
      display:flex; gap:10px; align-items:center;
      flex-wrap:wrap; margin:22px 0;
    }
    select, textarea {
      padding:10px; background:var(--panel); border:1px solid var(--line);
      color:var(--white); border-radius:9px; font:inherit;
    }
    .list { display:grid; gap:16px; }
    .card {
      background:linear-gradient(145deg,#101a2d,#0c1425);
      border:1px solid var(--line); border-radius:16px;
      padding:22px; min-width:0;
    }
    .card-head {
      display:flex; justify-content:space-between; gap:12px;
      flex-wrap:wrap; align-items:flex-start;
    }
    .badge {
      border:1px solid #3a526e; border-radius:99px;
      padding:4px 10px; font-size:12px; white-space:nowrap;
    }
    .badge.pending { color:var(--cyan); border-color:#276e70; }
    .badge.approved { color:var(--green); border-color:#32774d; }
    .badge.rejected { color:#ffb2b2; border-color:#75404a; }
    .flag { color:var(--cyan); font-size:12px; margin-top:5px; }
    .summary { color:var(--muted); margin:10px 0; }
    .description {
      white-space:pre-wrap; overflow-wrap:anywhere;
      background:#0b1424; border-radius:10px; padding:13px;
    }
    .details {
      display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px; margin-top:18px;
    }
    .detail { min-width:0; }
    .detail-label {
      color:var(--muted); font-size:12px;
      text-transform:uppercase; letter-spacing:1px;
    }
    .detail-value { overflow-wrap:anywhere; white-space:pre-wrap; }
    .detail-value a { color:var(--cyan); text-decoration:underline; }
    .technologies { display:flex; flex-wrap:wrap; gap:7px; margin-top:8px; }
    .technology {
      border:1px solid var(--line); border-radius:99px;
      padding:3px 9px; color:var(--muted); font-size:12px;
    }
    .review-note {
      width:100%; min-height:76px; resize:vertical; margin-top:8px;
    }
    .feature-option {
      display:flex; align-items:center; gap:9px;
      color:var(--muted); font-size:14px; margin-top:14px;
    }
    .feature-option input { accent-color:var(--cyan); }
    .actions {
      display:flex; gap:10px; flex-wrap:wrap; margin-top:16px;
      padding-top:16px; border-top:1px solid var(--line);
    }
    .empty {
      text-align:center; padding:35px 16px; color:var(--muted);
      border:1px dashed var(--line); border-radius:14px;
    }
    footer {
      border-top:1px solid var(--line); padding:22px 0;
      color:var(--muted); font-size:13px;
    }
    @media(max-width:600px) {
      .details { grid-template-columns:1fr; }
      .card { padding:17px; }
    }
  </style>
</head>
<body>
  <header>
    <nav class="container">
      <a class="logo" href="./index.html">NAJUA <span>TECH</span></a>
      <a class="muted" href="./dashboard.html">Member dashboard ↗</a>
    </nav>
  </header>

  <main class="container">
    <div class="topline">
      <div>
        <div class="eyebrow">Restricted administration</div>
        <h1>Project management</h1>
        <div class="muted">Review community projects and manage the public showcase.</div>
      </div>
      <button id="refresh" type="button">Refresh projects ↻</button>
    </div>

    <div id="status" class="status" role="status" aria-live="polite">
      Checking your sign-in and administrator access…
    </div>

    <section id="workspace" hidden>
      <div class="toolbar">
        <label for="filter">Show:</label>
        <select id="filter">
          <option value="pending">Pending review</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>
        <span id="count" class="muted"></span>
      </div>
      <div id="list" class="list"></div>
    </section>
  </main>

  <footer>
    <div class="container">© Najua Tech — Build. Create. Innovate.</div>
  </footer>

  <script>
    "use strict";

    const API = (
      window.location.hostname === "localhost" ||
      window.location.hostname === "127.0.0.1"
    )
      ? "http://localhost:8787"
      : "https://najua-auth-app.najuatech.workers.dev";

    const statusBox = document.getElementById("status");
    const workspace = document.getElementById("workspace");
    const list = document.getElementById("list");
    const filter = document.getElementById("filter");
    const refreshButton = document.getElementById("refresh");
    const count = document.getElementById("count");

    let projects = [];
    let busy = false;

    function showStatus(message, type = "") {
      statusBox.textContent = message;
      statusBox.className = "status" + (type ? " " + type : "");
      statusBox.hidden = false;
    }

    async function apiRequest(path, options = {}) {
      const response = await fetch(API + path, {
        ...options,
        credentials: "include",
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        const error = new Error(
          data.error || data.message || "Request failed."
        );
        error.status = response.status;
        throw error;
      }

      return data;
    }

    function addDetail(parent, label, value) {
      const wrapper = document.createElement("div");
      wrapper.className = "detail";

      const heading = document.createElement("div");
      heading.className = "detail-label";
      heading.textContent = label;

      const content = document.createElement("div");
      content.className = "detail-value";
      content.textContent =
        value === null || value === undefined || value === ""
          ? "Not provided"
          : String(value);

      wrapper.append(heading, content);
      parent.appendChild(wrapper);
    }

    function addSafeLink(parent, label, value) {
      const wrapper = document.createElement("div");
      wrapper.className = "detail";

      const heading = document.createElement("div");
      heading.className = "detail-label";
      heading.textContent = label;

      const content = document.createElement("div");
      content.className = "detail-value";

      let safeUrl = null;
      try {
        const parsed = new URL(value);
        if (parsed.protocol === "https:") safeUrl = parsed.href;
      } catch (_) {}

      if (safeUrl) {
        const link = document.createElement("a");
        link.href = safeUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = safeUrl;
        content.appendChild(link);
      } else {
        content.textContent = "Not provided";
      }

      wrapper.append(heading, content);
      parent.appendChild(wrapper);
    }

    function parseTechnologies(value) {
      if (Array.isArray(value)) return value;
      if (typeof value !== "string") return [];
      try {
        const parsed = JSON.parse(value);
        return Array.isArray(parsed) ? parsed : [];
      } catch (_) {
        return [];
      }
    }

    function createActionButton(label, className, handler) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      if (className) button.className = className;
      button.addEventListener("click", () => handler(button));
      return button;
    }

    function render() {
      list.replaceChildren();

      count.textContent =
        projects.length + (projects.length === 1 ? " project" : " projects");

      if (!projects.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No projects in this review category.";
        list.appendChild(empty);
        return;
      }

      for (const project of projects) {
        const card = document.createElement("article");
        card.className = "card";

        const head = document.createElement("div");
        head.className = "card-head";

        const titleGroup = document.createElement("div");
        const title = document.createElement("h2");
        title.textContent = project.title || "Untitled project";

        const author = document.createElement("div");
        author.className = "muted";
        author.textContent = "Submitted by " + (project.author_name || "Unknown member");

        titleGroup.append(title, author);

        const badge = document.createElement("span");
        badge.className = "badge " + String(project.status || "pending");
        badge.textContent = String(project.status || "pending").toUpperCase();

        head.append(titleGroup, badge);
        card.appendChild(head);

        if (project.is_featured) {
          const featured = document.createElement("div");
          featured.className = "flag";
          featured.textContent = "★ Featured project";
          card.appendChild(featured);
        }

        if (project.is_competition) {
          const competition = document.createElement("div");
          competition.className = "flag";
          competition.textContent = "Competition entry";
          card.appendChild(competition);
        }

        const summary = document.createElement("p");
        summary.className = "summary";
        summary.textContent = project.summary || "";
        card.appendChild(summary);

        const descriptionHeading = document.createElement("h3");
        descriptionHeading.textContent = "Project description";
        card.appendChild(descriptionHeading);

        const description = document.createElement("div");
        description.className = "description";
        description.textContent = project.description || "No description provided.";
        card.appendChild(description);

        const details = document.createElement("div");
        details.className = "details";

        addDetail(details, "Category", project.category);
        addDetail(details, "Team", project.team_name);
        addDetail(details, "Submitted", project.created_at);
        addDetail(details, "Last updated", project.updated_at);
        addSafeLink(details, "Live demo", project.demo_url);
        addSafeLink(details, "Repository", project.repository_url);
        addSafeLink(details, "Image", project.image_url);

        card.appendChild(details);

        const technologies = parseTechnologies(project.technologies);
        const techHeading = document.createElement("h3");
        techHeading.textContent = "Technologies";
        card.appendChild(techHeading);

        const techList = document.createElement("div");
        techList.className = "technologies";

        if (technologies.length) {
          for (const technology of technologies) {
            const tag = document.createElement("span");
            tag.className = "technology";
            tag.textContent = String(technology);
            techList.appendChild(tag);
          }
        } else {
          const none = document.createElement("span");
          none.className = "muted";
          none.textContent = "Not provided";
          techList.appendChild(none);
        }

        card.appendChild(techList);

        const noteLabel = document.createElement("label");
        noteLabel.textContent = "Review note (optional)";
        noteLabel.htmlFor = "review-note-" + project.id;

        const note = document.createElement("textarea");
        note.className = "review-note";
        note.id = "review-note-" + project.id;
        note.maxLength = 1000;
        note.placeholder = "Add feedback for the project record…";

        card.append(noteLabel, note);

        const actions = document.createElement("div");
        actions.className = "actions";

        const featureLabel = document.createElement("label");
        featureLabel.className = "feature-option";

        const featureCheckbox = document.createElement("input");
        featureCheckbox.type = "checkbox";
        featureCheckbox.checked = Boolean(project.is_featured);
        featureLabel.append(
          featureCheckbox,
          document.createTextNode("Feature this project on the public website")
        );

        if (project.status === "approved") {
          actions.appendChild(
            createActionButton(
              "Save featured setting",
              "primary",
              button => reviewProject(project, "approve", featureCheckbox.checked, note, button)
            )
          );
        } else {
          actions.appendChild(
            createActionButton(
              "Approve project",
              "primary",
              button => reviewProject(project, "approve", featureCheckbox.checked, note, button)
            )
          );

          actions.appendChild(
            createActionButton(
              "Reject project",
              "reject",
              button => reviewProject(project, "reject", false, note, button)
            )
          );
        }

        card.appendChild(featureLabel);
        card.appendChild(actions);
        list.appendChild(card);
      }
    }

    async function loadProjects() {
      if (busy) return;

      busy = true;
      refreshButton.disabled = true;
      filter.disabled = true;
      showStatus("Loading projects…");

      try {
        const data = await apiRequest(
          "/api/admin/projects?status=" + encodeURIComponent(filter.value)
        );

        projects = Array.isArray(data.projects) ? data.projects : [];
        workspace.hidden = false;
        statusBox.hidden = true;
        render();
      } catch (error) {
        workspace.hidden = true;

        if (error.status === 401) {
          showStatus("Please sign in with your Najua Tech administrator account.", "error");
          window.setTimeout(() => {
            window.location.href = "./login.html";
          }, 1200);
        } else if (error.status === 403) {
          showStatus("Access denied. This page is restricted to the authorized administrator.", "error");
        } else {
          showStatus(error.message || "Could not load projects. Please try again.", "error");
        }
      } finally {
        busy = false;
        refreshButton.disabled = false;
        filter.disabled = false;
      }
    }

    async function reviewProject(project, decision, isFeatured, note, button) {
      const action = decision === "approve" ? "approve" : "reject";
      const message = decision === "approve"
        ? "Approve this project" + (isFeatured ? " and feature it" : "") + "?"
        : "Reject this project?";

      if (!window.confirm(message)) return;

      button.disabled = true;

      const cardButtons = button.closest(".card").querySelectorAll("button");
      cardButtons.forEach(item => item.disabled = true);

      try {
        await apiRequest(
          "/api/admin/projects/" + encodeURIComponent(project.id) + "/review",
          {
            method: "POST",
            body: JSON.stringify({
              decision,
              is_featured: decision === "approve" && isFeatured,
              review_note: note.value.trim()
            })
          }
        );

        showStatus(
          decision === "approve"
            ? "Project approved successfully."
            : "Project rejected successfully.",
          "success"
        );

        await loadProjects();
      } catch (error) {
        showStatus(error.message || "Could not update this project.", "error");
        cardButtons.forEach(item => item.disabled = false);
      }
    }

    refreshButton.addEventListener("click", loadProjects);
    filter.addEventListener("change", loadProjects);

    async function initialize() {
      try {
        const session = await apiRequest("/api/auth/get-session");

        if (!session.user) {
          window.location.replace("./login.html");
          return;
        }

        await loadProjects();
      } catch (error) {
        if (error.status === 401) {
          window.location.replace("./login.html");
        } else {
          showStatus("Could not verify your sign-in. Please try again.", "error");
        }
      }
    }

    initialize();
  </script>
</body>
</html>
