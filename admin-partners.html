<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d1a">
  <title>Partnership Review | Najua Tech</title>
  <style>
    :root {
      --bg:#080d1a; --panel:#101a2d; --blue:#48a7ff;
      --cyan:#56f0e0; --white:#f5f8ff; --muted:#a7b4ca;
      --line:#24334b; --red:#ff9292; --green:#56f0e0;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--white); font:16px/1.6 Arial,Helvetica,sans-serif; }
    a { color:inherit; text-decoration:none; }
    .container { width:min(1100px,92%); margin:auto; }
    header { border-bottom:1px solid var(--line); background:#080d1af5; }
    nav { min-height:74px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .logo { font-size:22px; font-weight:900; letter-spacing:1px; }
    .logo span { color:var(--cyan); }
    .muted { color:var(--muted); }
    main { padding:38px 0 70px; }
    .eyebrow { color:var(--cyan); font-size:12px; letter-spacing:3px; font-weight:bold; text-transform:uppercase; }
    h1 { font-size:clamp(32px,6vw,48px); line-height:1.15; margin:10px 0; }
    .topline { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:24px; }
    button, .button {
      display:inline-block; border:1px solid var(--line); border-radius:9px;
      padding:10px 15px; font-weight:700; cursor:pointer; font-size:14px;
      background:#14233a; color:var(--white);
    }
    button:disabled { opacity:.55; cursor:wait; }
    .primary { color:#07111e; background:linear-gradient(100deg,var(--cyan),var(--blue)); border:0; }
    .reject { border-color:#75404a; color:#ffb2b2; background:#291721; }
    .status { padding:13px 16px; border:1px solid var(--line); border-radius:10px; margin:16px 0; color:var(--muted); overflow-wrap:anywhere; }
    .status.error { border-color:#75404a; color:var(--red); }
    .status.success { color:var(--cyan); }
    .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:22px 0; }
    select { padding:10px; background:var(--panel); border:1px solid var(--line); color:var(--white); border-radius:9px; }
    .list { display:grid; gap:16px; }
    .card { background:linear-gradient(145deg,#101a2d,#0c1425); border:1px solid var(--line); border-radius:16px; padding:22px; min-width:0; }
    .card-head { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:flex-start; }
    h2 { font-size:21px; margin:0 0 5px; overflow-wrap:anywhere; }
    .badge { border:1px solid #3a526e; border-radius:99px; padding:4px 10px; font-size:12px; white-space:nowrap; }
    .badge.pending { color:var(--cyan); border-color:#276e70; }
    .badge.approved { color:#a9f5ca; border-color:#32774d; }
    .badge.rejected { color:#ffb2b2; border-color:#75404a; }
    .details { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:20px; }
    .detail { min-width:0; }
    .detail-label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:1px; }
    .detail-value { overflow-wrap:anywhere; white-space:pre-wrap; }
    .detail-value a { color:var(--cyan); text-decoration:underline; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; padding-top:16px; border-top:1px solid var(--line); }
    .empty { text-align:center; padding:35px 16px; color:var(--muted); border:1px dashed var(--line); border-radius:14px; }
    footer { border-top:1px solid var(--line); padding:22px 0; color:var(--muted); font-size:13px; }
    @media(max-width:600px) { .details { grid-template-columns:1fr; } .card { padding:17px; } }
  </style>
</head>
<body>
  <header>
    <nav class="container">
      <a class="logo" href="./index.html">NAJUA <span>TECH</span></a>
      <a class="muted" href="./dashboard.html">Member dashboard ↗</a>
    </nav>
  </header>

  <main class="container">
    <div class="topline">
      <div>
        <div class="eyebrow">Restricted administration</div>
        <h1>Partnership inquiries</h1>
        <div class="muted">Review organizations interested in working with Najua Tech.</div>
      </div>
      <button id="refresh" type="button">Refresh requests ↻</button>
    </div>

    <div id="status" class="status" role="status" aria-live="polite">Checking your sign-in and administrator access…</div>

    <section id="workspace" hidden>
      <div class="toolbar">
        <label for="filter">Show:</label>
        <select id="filter">
          <option value="All">All requests</option>
          <option value="Pending">Pending</option>
          <option value="Approved">Approved</option>
          <option value="Rejected">Rejected</option>
        </select>
        <span id="count" class="muted"></span>
      </div>
      <div id="list" class="list"></div>
    </section>
  </main>

  <footer><div class="container">© Najua Tech — Build. Create. Innovate.</div></footer>

  <script>
    const API = "https://najua-auth-app.najuatech.workers.dev";
    const statusBox = document.getElementById("status");
    const workspace = document.getElementById("workspace");
    const list = document.getElementById("list");
    const filter = document.getElementById("filter");
    const refreshButton = document.getElementById("refresh");
    let inquiries = [];
    let busy = false;

    function showStatus(message, type = "") {
      statusBox.textContent = message;
      statusBox.className = "status" + (type ? " " + type : "");
      statusBox.hidden = false;
    }

    async function apiRequest(path, options = {}) {
      const response = await fetch(API + path, {
        ...options,
        credentials: "include",
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const error = new Error(data.error || data.message || "Request failed.");
        error.status = response.status;
        throw error;
      }
      return data;
    }

    function addDetail(parent, label, value, kind = "text") {
      const wrapper = document.createElement("div");
      wrapper.className = "detail";
      const heading = document.createElement("div");
      heading.className = "detail-label";
      heading.textContent = label;
      const content = document.createElement("div");
      content.className = "detail-value";

      const safeValue = value == null || value === "" ? "Not provided" : String(value);
      if (kind === "email" && safeValue !== "Not provided") {
        const link = document.createElement("a");
        link.href = "mailto:" + safeValue;
        link.textContent = safeValue;
        content.appendChild(link);
      } else if (kind === "phone" && safeValue !== "Not provided") {
        const link = document.createElement("a");
        link.href = "tel:" + safeValue.replace(/[^\d+]/g, "");
        link.textContent = safeValue;
        content.appendChild(link);
      } else {
        content.textContent = safeValue;
      }

      wrapper.append(heading, content);
      parent.appendChild(wrapper);
    }

    function render() {
      list.replaceChildren();
      const visible = inquiries.filter(item => filter.value === "All" || item.status === filter.value);
      document.getElementById("count").textContent =
        visible.length + (visible.length === 1 ? " request" : " requests");

      if (!visible.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No partnership inquiries in this view.";
        list.appendChild(empty);
        return;
      }

      for (const item of visible) {
        const card = document.createElement("article");
        card.className = "card";

        const head = document.createElement("div");
        head.className = "card-head";
        const titleGroup = document.createElement("div");
        const title = document.createElement("h2");
        title.textContent = item.organization_name || "Unnamed organization";
        const contact = document.createElement("div");
        contact.className = "muted";
        contact.textContent = item.contact_name || "Contact not provided";
        titleGroup.append(title, contact);

        const badge = document.createElement("span");
        badge.className = "badge " + String(item.status || "Pending").toLowerCase();
        badge.textContent = item.status || "Pending";
        head.append(titleGroup, badge);
        card.appendChild(head);

        const details = document.createElement("div");
        details.className = "details";
        addDetail(details, "Contact email", item.email, "email");
        addDetail(details, "Phone", item.phone, "phone");
        addDetail(details, "Partnership area", item.partnership_type);
        addDetail(details, "Submitted", item.created_at);
        addDetail(details, "Proposed support", item.proposed_support);
        addDetail(details, "Additional message", item.message);
        card.appendChild(details);

        if (item.status === "Pending") {
          const actions = document.createElement("div");
          actions.className = "actions";

          for (const decision of ["Approved", "Rejected"]) {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = decision === "Approved" ? "Approve request" : "Reject request";
            button.className = decision === "Approved" ? "primary" : "reject";
            button.addEventListener("click", () => decide(item, decision, button));
            actions.appendChild(button);
          }
          card.appendChild(actions);
        } else if (item.decided_at) {
          const decided = document.createElement("p");
          decided.className = "muted";
          decided.textContent = "Decision recorded: " + item.decided_at;
          card.appendChild(decided);
        }

        list.appendChild(card);
      }
    }

    async function loadInquiries() {
      if (busy) return;
      busy = true;
      refreshButton.disabled = true;
      showStatus("Loading partnership inquiries…");

      try {
        const data = await apiRequest("/api/admin/partner-inquiries");
        inquiries = Array.isArray(data.inquiries) ? data.inquiries : [];
        workspace.hidden = false;
        statusBox.hidden = true;
        render();
      } catch (error) {
        workspace.hidden = true;
        if (error.status === 401) {
          showStatus("Please sign in with your Najua Tech administrator account to continue.", "error");
          window.setTimeout(() => {
            window.location.href = "./login.html";
          }, 1000);
        } else if (error.status === 403) {
          showStatus("Access denied. This page is restricted to the authorized Najua Tech administrator.", "error");
        } else {
          showStatus(error.message || "Could not load requests. Please try again.", "error");
        }
      } finally {
        busy = false;
        refreshButton.disabled = false;
      }
    }

    async function decide(item, decision, button) {
      const action = decision.toLowerCase();
      if (!window.confirm("Are you sure you want to " + action + " this partnership inquiry from " + item.organization_name + "?")) return;

      button.disabled = true;
      try {
        await apiRequest("/api/admin/partner-inquiries/" + encodeURIComponent(item.id) + "/decision", {
          method: "POST",
          body: JSON.stringify({ status: decision })
        });
        showStatus("Inquiry " + action + " successfully.", "success");
        await loadInquiries();
      } catch (error) {
        if (error.status === 401) {
          showStatus("Your session has expired. Please sign in again.", "error");
        } else if (error.status === 403) {
          showStatus("Access denied. Only the authorized administrator can decide requests.", "error");
        } else {
          showStatus(error.message || "Could not record the decision.", "error");
        }
        button.disabled = false;
      }
    }

    refreshButton.addEventListener("click", loadInquiries);
    filter.addEventListener("change", render);

    async function initialize() {
      try {
        const session = await apiRequest("/api/auth/get-session");
        if (!session.user) {
          window.location.replace("./login.html");
          return;
        }
        await loadInquiries();
      } catch (error) {
        if (error.status === 401) {
          window.location.replace("./login.html");
        } else {
          showStatus("Could not verify your sign-in. Please try again.", "error");
        }
      }
    }

    initialize();
  </script>
</body>
</html>
